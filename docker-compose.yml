services:
  db:
    image: postgres:16-alpine
    container_name: sih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: sih_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sih_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ipfs:
    image: ipfs/kubo:v0.26.0
    container_name: sih_ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"      # ipfs swarm
      - "5001:5001"      # ipfs api
      - "8080:8080"      # ipfs gateway
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "diag", "sys"]
      interval: 10s
      timeout: 5s
      retries: 3

  data-service:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile
    container_name: sih_data_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sih_user:sih_password@db:5432/sih_db
      - REDIS_URL=redis://redis:6379/0
      - IPFS_API_URL=http://ipfs:5001
      - INTERNAL_API_KEY=sih_super_secret_internal_key_2026
      - HOST=0.0.0.0
      - PORT=8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ipfs:
        condition: service_healthy

  application-service:
    build:
      context: ./services/application-service
      dockerfile: Dockerfile
    container_name: sih_application_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MOCK_MODE=false
      - DATA_SERVICE_URL=http://data-service:8001
      - BLOCKCHAIN_SERVICE_URL=http://blockchain-gateway:3005
      - INTERNAL_API_KEY=sih_super_secret_internal_key_2026
      - JWT_SECRET=sih-2026-super-secret-jwt-key-food-traceability-platform
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - data-service

  blockchain-gateway:
    build:
      context: ./services/blockchain-service/gateway
      dockerfile: Dockerfile
    container_name: sih_blockchain_gateway
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - CHANNEL_NAME=tracechannel
      - CHAINCODE_NAME=traceability
      - CRYPTO_PATH=/opt/fabric/crypto-config
      - WEBHOOK_URL=http://application-service:8000/api/internal/webhooks/fabric
      - INTERNAL_API_KEY=sih_super_secret_internal_key_2026
      - EVENT_LISTENER_MSP=Org1MSP
    volumes:
      - ./services/blockchain-service/fabric/network/crypto-config:/opt/fabric/crypto-config:ro
    depends_on:
      - application-service

volumes:
  postgres_data:
  redis_data:
  ipfs_staging:
  ipfs_data:
